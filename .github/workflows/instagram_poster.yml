name: Daily Instagram Sheets Publisher

on:
  schedule:
    # Runs automatically every day at 09:00 UTC (Adjust time as needed)
    - cron: '0 9 * * *'
  # Allows you to manually trigger the script anytime from the GitHub Actions tab
  workflow_dispatch:

jobs:
  run-posting-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests gspread google-auth python-dotenv

      - name: Recreate service_account.json from Secret
        run: |
          echo "${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}" > service_account.json

      - name: Run Token Refresh Check
        env:
          IG_APP_ID: ${{ secrets.IG_APP_ID }}
          IG_APP_SECRET: ${{ secrets.IG_APP_SECRET }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: |
          cd instagramPipeline_script
          if [ -f refresh_token.py ]; then
            python refresh_token.py
          fi

      - name: Execute Daily Instagram Posting Script
        env:
          IG_ACCOUNT_ID: ${{ secrets.IG_ACCOUNT_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: |
          python sheets_pipeline.py

      - name: Clean Up Service Account Credentials
        if: always()
        run: |
          rm -f service_account.json
